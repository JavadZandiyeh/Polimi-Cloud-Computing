place_recommender:
  name: Visiting Place Recommendation (VPR)
  version: "1.0.0"
  url: "http://localhost:8001"
  description: >-
    Recommends a set of places to visit in the destination city based on the
    user's preferences, budget, and other relevant factors. Recommendations are
    strong candidates for the final trip schedule.
    Every recommended place must be located in the destination city.
    Recommendations prioritize preference fit, budget fit, quality signals, and,
    when the user's residence or accommodation area is known, practical access.
    The agent requires an identifiable destination city before calling any
    Google Maps tools or recommending places. An experience type or category is
    also required unless the user explicitly asks for general recommendations.
    If required information is missing, the agent returns empty `places` and
    uses `description` to state clearly what is still needed.
    The agent uses Google Maps only when both required gates are satisfied. It
    bases factual place details on search results only and does not invent
    places, links, coordinates, or other details.
  provider:
    organization: MSc Cloud Computing Project
    url: https://github.com/javad
  skills:
    - id: recommend_visiting_places
      name: Recommend Visiting Places
      description: >-
        Recommends places to visit in the destination city based on the user's
        preferences, budget, and other relevant factors.
        Requires two gates before calling Google Maps tools or recommending
        places: an identifiable destination city, and an experience type or
        category unless the user explicitly requested general recommendations.
        If either gate is missing, returns empty `places` and uses `description`
        to state what is still needed.
        Once both gates are satisfied, searches for specific places using
        Google Maps queries that name the city explicitly and reflect the
        requested category or preferences. Only places confirmed to be in the
        destination city are eligible. Places outside the city are excluded.
        Places are ranked with consecutive `rank` values starting from 0.
        Ranking priority is: (1) confirmed destination-city eligibility,
        (2) preference and category fit, (3) budget fit, (4) quality signals
        such as ratings, reviews, or listing completeness, and (5) proximity or
        practical access as a tiebreaker when residence or accommodation area is
        known.
        Returns empty `places` when the destination city is not defined, the
        required experience type or category is missing, search yields no usable
        matches, all tool attempts fail, or additional information is needed
        before recommending responsibly.
        Returns recommendations when the city and required context are clear and
        search returns viable options. Includes a brief overall `description`.
      tags:
        - recommendations
        - trip-planning
        - visiting-places
        - google-maps
      examples:
        - "Recommend historical sites to visit in Rome for a 3-day trip on a moderate budget."
        - "Suggest family-friendly attractions in Milan, ideally near Navigli."
        - "I'm a solo traveler in Berlin who likes nightlife — where should I go?"
        - "Pick top cultural places in Kyoto for someone interested in temples and traditional gardens."
        - "Recommend vegetarian-friendly restaurants in Barcelona, mid-range budget."
        - "Give me general recommendations for places to visit in Lisbon."
        - "Find great coffee shops."
      input_modes:
        - text/plain
      output_modes:
        - application/json
