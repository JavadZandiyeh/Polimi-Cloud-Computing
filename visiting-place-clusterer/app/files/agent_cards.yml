place_clusterer:
  name: Visiting Place Clusterer (VPC)
  version: "1.0.0"
  url: "http://localhost:8000"
  description: >-
    Groups recommended places into geographically coherent day-clusters for
    efficient trip planning. Objectives in priority order: (1) minimise travel
    distance within each day, (2) produce one cluster per trip day, (3) avoid
    clusters too large for a realistic day by rebalancing based on estimated
    visit durations. Each request provides the places (as produced by the
    visiting place recommender) and the number of trip days, and receives structured JSON
    with an overall summary and one cluster per trip day. Clustering uses K-means
    on GPS coordinates followed by a duration-aware rebalancing pass. Every input
    place is preserved exactly and assigned to exactly one day. Returns an empty
    list when the places or trip days are missing.
  provider:
    organization: MSc Cloud Computing Project
    url: https://github.com/javad
  skills:
    - id: cluster_visiting_places
      name: Cluster Visiting Places
      description: >-
        Groups recommended places into day-clusters so each cluster holds the
        places intended for a single trip day, minimising travel distance within
        a day.

        Requires the list of places (each with gps_coordinates) and the number
        of trip days in the input. The number of clusters equals the number of
        trip days, capped at the number of places. When either is missing,
        returns an empty list and explains what is still needed.

        Clustering uses K-means++ on GPS coordinates to minimise intra-day
        travel, followed by a duration-aware rebalancing pass that moves places
        from overloaded clusters (those exceeding 8 hours of estimated visit
        time) to geographically nearby ones. Visit durations are estimated from
        place type (e.g. museum ≈ 2 h, restaurant ≈ 1 h). Places are never
        invented, dropped, or modified — the same places that come in are
        grouped and returned unchanged.

        Returns one cluster per trip day, each holding its assigned places with
        their original details, plus an overall summary of how the trip was
        grouped.
      tags:
        - clustering
        - trip-planning
        - visiting-places
        - itinerary
      examples:
        - "Cluster these 8 Milan places into 2 days."
        - "Group the recommended Rome attractions across 3 days."
        - "Split this list of places into day-groups for a 4-day visit."
      input_modes:
        - text/plain
        - application/json
      output_modes:
        - application/json
