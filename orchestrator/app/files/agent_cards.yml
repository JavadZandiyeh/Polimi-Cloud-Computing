orchestrator:
  name: Travel Plan Orchestrator (Agent 0)
  version: "1.0.0"
  url: "http://localhost:8000"
  description: >-
    Top-level orchestrator for the multi-agent travel planner. Chats with the user to
    capture the destination, dates, and preferences, then coordinates three specialist
    agents over the A2A protocol — Visiting Place Recommendation, Visiting Place
    Clustering, and Single Day Scheduling — to produce a complete day-by-day itinerary
    with attractions, meals, and travel. Built with the Amazon Strands Agents SDK using
    an OpenAI model. Exposes a web chat UI for end users.
  provider:
    organization: MSc Cloud Computing Project
    url: https://github.com/javad
  skills:
    - id: plan_trip
      name: Plan a Trip
      description: >-
        Plans an end-to-end multi-day trip from a natural-language request. Gates on the
        required inputs first — destination city, trip duration, and interests — asking the
        user for anything essential that is missing before calling any agent. Then it
        recommends places, validates and (if needed) retries that result, groups the places
        into one cluster per trip day, re-joins each clustered title with its full place
        details, and schedules each day separately (ordering visits, estimating travel, and
        inserting lunch and dinner). It recovers from agent errors by retrying or asking the
        user, and keeps the days that succeeded rather than aborting.

        Returns a polished, detail-rich day-by-day itinerary that uses each place's images,
        address, opening hours, coordinates, rating, price, and links, with the meals and exact
        times produced by the scheduler, and offers to adjust it.
      tags:
        - orchestration
        - trip-planning
        - itinerary
        - multi-agent
        - a2a
      examples:
        - "Plan a 2-day trip to Milan, I like history and food, mid budget, 2026-06-10 to 2026-06-11."
        - "I have 3 days in Rome next month and love art and good coffee — build me an itinerary."
        - "Weekend in Barcelona, vegetarian, prefer walking and metro, relaxed pace."
      input_modes:
        - text/plain
      output_modes:
        - text/plain
